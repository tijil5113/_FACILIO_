<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FACILIO — Understand and clean data safely" />
    <title>FACILIO — Understand and clean data safely</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("facilio.preferences");
          var prefs = raw ? JSON.parse(raw) : {};
          var theme = prefs.theme || "system";
          var dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var motion = prefs.motion || "system";
          var reduced =
            motion === "reduced" ||
            (motion !== "reduced" &&
              motion !== "full" &&
              window.matchMedia("(prefers-reduced-motion: reduce)").matches);
          document.documentElement.dataset.motion = reduced ? "reduced" : "full";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.motion = "full";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
