[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facilio-api"
version = "0.1.0"
description = "FACILIO Intelligent Data Operations Platform API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FACILIO contributors" }]
dependencies = [
    "flask>=3.1,<4",
    "flask-cors>=5.0,<6",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "gunicorn>=23,<24",
    "redis>=5.2,<6",
    "rq>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../packages/processing/src"]
addopts = [
    "-q",
    "--strict-markers",
    "--cov=facilio",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["facilio"]
omit = ["*/migrations/*", "*/wsgi.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
