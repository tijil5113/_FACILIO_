name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: facilio
          POSTGRES_PASSWORD: facilio_ci
          POSTGRES_DB: facilio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facilio -d facilio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "../../packages/processing"
          pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff lint
        run: ruff check src tests
      - name: Tests
        run: pytest
      - name: PostgreSQL migrate from zero
        env:
          APP_ENV: testing
          SECRET_KEY: ci-secret-key-not-for-production-use
          DATABASE_URL: postgresql+psycopg://facilio:facilio_ci@localhost:5432/facilio
        run: alembic upgrade head
      - name: Python dependency audit
        continue-on-error: true
        run: pip-audit

  processing:
    name: Processing package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/processing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/processing/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: npm production audit
        run: npm audit --omit=dev

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Secret pattern scan
        run: |
          if git grep -I -E -- '-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- ':!.github/**'; then
            echo "Possible private key committed"
            exit 1
          fi

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t facilio-api:ci -f apps/api/Dockerfile .
      - name: Verify backend image contents
        run: |
          docker run --rm --entrypoint python facilio-api:ci -c "
          from facilio.services.samples import bundled_sample_path
          from importlib.metadata import version
          from pathlib import Path
          assert version('facilio-api')
          assert version('facilio-processing')
          assert Path('/app/README.md').is_file()
          assert Path('/app/scripts/docker-entrypoint.sh').is_file()
          sample = bundled_sample_path('facilio-demo-customers.csv')
          assert sample == Path('/app/sample-data/facilio-demo-customers.csv')
          assert sample.is_file()
          print('backend image ok')
          "
      - name: Build web image
        run: >
          docker build -t facilio-web:ci -f apps/web/Dockerfile
          --build-arg VITE_API_BASE_URL=https://api.example.test
          ./apps/web
      - name: Verify web bundle uses build-time API origin
        run: |
          docker run --rm --entrypoint sh facilio-web:ci -c \
            "grep -R 'https://api.example.test' /usr/share/nginx/html >/dev/null"
