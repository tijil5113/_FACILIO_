services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facilio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facilio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-facilio}
    ports:
      - "5432:5432"
    volumes:
      - facilio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facilio} -d ${POSTGRES_DB:-facilio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "facilio.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-string}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-facilio}:${POSTGRES_PASSWORD:-facilio_dev}@db:5432/${POSTGRES_DB:-facilio}
      REDIS_URL: redis://redis:6379/0
      JOB_QUEUE_NAME: workflows
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPLOAD_ROOT: /app/runtime/uploads
      MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-3}
      JOB_STALE_SECONDS: ${JOB_STALE_SECONDS:-90}
    volumes:
      - facilio_uploads:/app/runtime/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-string}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-facilio}:${POSTGRES_PASSWORD:-facilio_dev}@db:5432/${POSTGRES_DB:-facilio}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-18874368}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-16}
      PREVIEW_MAX_ROWS: ${PREVIEW_MAX_ROWS:-100}
      UPLOAD_ROOT: /app/runtime/uploads
      REDIS_URL: redis://redis:6379/0
      JOB_QUEUE_NAME: workflows
      MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-3}
      JOB_STALE_SECONDS: ${JOB_STALE_SECONDS:-90}
    ports:
      - "5050:5000"
    volumes:
      - facilio_uploads:/app/runtime/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://api:5000
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  facilio_pgdata:
  facilio_uploads:
